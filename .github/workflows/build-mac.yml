name: Build Desktop Clients (Win & macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd web/frontend
          npm install
          npm run build

      - name: Build macOS DMG & ZIP
        run: |
          cd desktop
          npm install
          npm run dist:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Release
          path: |
            release/*.dmg
            release/*.zip
