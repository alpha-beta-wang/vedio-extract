name: Build Desktop Clients (Windows & macOS Release)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd web/frontend
          npm install
          npm run build

      - name: Build macOS DMG & ZIP
        run: |
          cd desktop
          npm install
          npm run dist:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            release/*.dmg
            release/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd web/frontend
          npm install
          npm run build

      - name: Build Windows NSIS Setup
        run: |
          cd desktop
          npm install
          npm run dist:installer

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            release/*.exe

  publish-release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES_ARG=()
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES_ARG=(--notes-file RELEASE_NOTES.md)
          else
            NOTES_ARG=(--generate-notes)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists for tag $TAG, updating..."
            gh release edit "$TAG" "${NOTES_ARG[@]}" --title "vedioNoter $TAG" --draft=false
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating new release for tag $TAG..."
            gh release create "$TAG" release-assets/* \
              --title "vedioNoter $TAG" \
              --prerelease \
              --draft=false \
              "${NOTES_ARG[@]}"
          fi
