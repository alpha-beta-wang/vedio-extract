# vedioNoter 配置文件
# 修改此文件即可调整所有默认参数，无需改动代码

# -----------------------------------------------------------
# 通用 LLM 接口配置 (兼容 OpenAI / DeepSeek / 硅基流动 / 通义千问 / Ollama 等)
# -----------------------------------------------------------
llm:
  provider: "deepseek"                           # 服务商预设: deepseek / openai / siliconflow / qwen / moonshot / zhipu / ollama / openrouter / custom
  api_key: ""                                    # 在此填入你的 API key，或设置环境变量 DEEPSEEK_API_KEY / OPENAI_API_KEY
  base_url: "https://api.deepseek.com"           # API 端点地址 (支持兼容 OpenAI /v1 协议的任意端点)
  model: "deepseek-chat"                         # 默认整理模型 (可通过设置面板点击自动获取)
  temperature: 0.3                               # 生成随机度 (0.0 ~ 1.0)
  max_tokens: 8192                               # 单次生成最大 token 数
  max_chars_per_chunk: 30000                     # 单次分块最大输入字符数

# 兼容旧版配置字段
deepseek:
  api_key: ""
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  max_chars_per_chunk: 30000

# -----------------------------------------------------------
# 存储与目录配置 (Storage Directories)
# -----------------------------------------------------------
storage:
  video_dir: "vedio"                             # 视频输入导入目录 (支持绝对路径如 D:/Videos 或相对路径)
  audio_temp_dir: "audio_temp"                   # 音频提取临时缓存目录
  transcript_dir: "output"                       # 语音撰写/转写文本输出目录
  note_dir: "output"                             # AI 结构化学习笔记输出目录

# -----------------------------------------------------------
# Whisper 语音识别配置
# -----------------------------------------------------------
whisper:
  model: "small"                                 # 默认模型
  available_models:                              # 可选模型列表
    - tiny
    - tiny.en
    - base
    - base.en
    - small
    - small.en
    - medium
    - medium.en
    - large-v1
    - large-v2
    - large-v3
    - large-v3-turbo

# -----------------------------------------------------------
# 关键帧提取配置
# -----------------------------------------------------------
keyframe:
  scene_threshold: 0.3                           # 场景变化检测阈值 (0-1)，越大越不敏感
  max_frames: 20                                 # 最多提取帧数

# -----------------------------------------------------------
# Web 服务器配置
# -----------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8765
